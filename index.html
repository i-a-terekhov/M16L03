<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app">
    <App/>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp } = Vue;

    const app = createApp();

    app.component('App', {
        data() {
            return {
                count: 0
            }
        },
        methods: {
            changeCount() {
                this.count++;
            }
        },
        mounted() {
            console.log('Component mounted. Count is ' + this.count)
        },
        template: `
          <p>Count is {{ count }}</p>
          <button @click="changeCount">Click me</button>
        `
    });

    app.mount('#app');
</script>
</body>
</html>
