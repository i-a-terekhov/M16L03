<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app">
    <p>Count is {{count}}</p>
    <button @click="changeCount">Click me</button>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp } = Vue

    createApp({
        data() {  // если свойства указаны в методе data, то vue сам отслеживает их изменения
            return {
                count: 0
            }
        },
        methods: {
            changeCount() {
                this.count++;
            }
        },
        mounted() {   // хук жизненного цикла, который срабатывает после отрисовки DOM
            console.log('Component mounted. Count is ' + this.count)
        },
    }).mount('#app')
</script>
</body>
</html>
